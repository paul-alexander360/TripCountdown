name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use the permanent signing key
        run: base64 -d ci/debug-keystore.b64 > app/ci-debug.keystore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - name: Show signing fingerprint
        run: keytool -list -v -keystore app/ci-debug.keystore -storepass android | grep -i sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TripCountdown-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the public download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TravelTracker.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TravelTracker.apk --title "Travel Tracker (build ${{ github.run_number }})" --notes "Latest build of Travel Tracker for Android" --latest
